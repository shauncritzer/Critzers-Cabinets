<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!--
      Route-specific <title>, description, canonical, Open Graph/Twitter tags,
      and JSON-LD structured data are injected per request by the Express SEO
      middleware (server/_core/seo.ts) from the shared registry in
      shared/seo.ts. The tags below are only the fallback for the rare case
      where the HTML is served without going through that middleware.
    -->
    <title>Critzer's Cabinet Creations | Cabinets, Refacing &amp; Countertops in Charlottesville, VA</title>
    <meta name="description" content="Serving Charlottesville since 1986 - 40 years of family craftsmanship. Cabinet refacing, cabinet repair, Cambria quartz countertops, hardware upgrades, closet design, and full kitchen and bath remodeling. Call (434) 973-1691." />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <link rel="apple-touch-icon" href="/images/logo.png" />
    <meta name="theme-color" content="#1f2937" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
